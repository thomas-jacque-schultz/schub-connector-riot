spring:
  config:
    import: "optional:configtree:/run/secrets/"
  application:
    name: connector.riot
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST:schub-mongo}:27017/${MONGO_DB:riot}?authSource=${MONGO_DB:riot}
      # Sans ceci, @Indexed et @CompoundIndex sont inertes (défaut Boot : false).
      auto-index-creation: true

server:
  port: 8080

schub:
  internal-secret: ${SCHUB_INTERNAL_SECRET:change-me-internal-secret}

# region (europe) : account-v1, match-v5. platform (euw1) : league-v4, champion-mastery-v4.
# Mauvais hôte = 403 (vérifié le 18-09).
riot:
  api-key: ${RIOT_API_KEY:}
  region: ${RIOT_REGION:europe}
  platform: ${RIOT_PLATFORM:euw1}
  data-dragon-base-url: https://ddragon.leagueoflegends.com
  data-dragon-locale: fr_FR
  connect-timeout: 3s
  read-timeout: 10s

  # Fenêtres d'une clé de développement (X-App-Rate-Limit : 100:120,20:1).
  quota:
    burst-requests: 20
    burst-window: 1s
    sustained-requests: 100
    sustained-window: 2m
    safety-margin: 2
    max-retries-on429: 3
    max-retry-after: 3m
    acquire-timeout: 5m
    # Sous le read-timeout du cœur (5 s), moins l'appel à Riot lui-même.
    interactive-timeout: 2s
    bulk-yield: 10s
    interactive-reserve: 10
    interactive-reserve-idle: 1m

  cache:
    # Une partie peut apparaître dans l'historique avec du retard.
    history-overlap: 1h
    history-freshness: 15m
    history-depth: 365d
    ranking-ttl: 1h
    mastery-ttl: 6h
    game-version-ttl: 6h
    id-page-size: 100
    max-id-pages: 50
    max-details-per-call: 60

  ingest:
    enabled: ${RIOT_INGEST_ENABLED:true}
    poll-interval: 2s
    batch-size: 25
    # Doit dépasser quota.acquire-timeout.
    lease: 15m
    max-attempts: 5
    retry-backoff: 1m
    quota-backoff: 30s
    idle-backoff: 5m

  # En prod elle tourne toujours ; en dev, RIOT_CRAWLER_SWITCHABLE=true la laisse à l'owner.
  crawler:
    switchable: ${RIOT_CRAWLER_SWITCHABLE:false}
    enabled-by-default: ${RIOT_CRAWLER_ENABLED:true}
    interval: 1m
    accounts-per-round: 20
    backlog: 500
    refresh-after: 7d
    storage-alert-bytes: ${RIOT_STORAGE_ALERT_BYTES:2000000000000}

  # Graines tirées des classements, par palier : suit la collecte de fond (suspendu avec elle).
  sampling:
    enabled: ${RIOT_SAMPLING_ENABLED:true}
    seeds-per-tier: 300
    window: 28d
    games-per-seed: 20
    seeds-per-page: 10
    max-page: 50

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
